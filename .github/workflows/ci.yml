name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. A new push to a pull request cancels its older run; on main
# an in-progress run is always left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The .env.example values. Next inlines NEXT_PUBLIC_* at build time and
      # `next typegen` loads next.config.ts, which validates them. The
      # Supabase pair points at the local stack started below; the key is the
      # CLI's fixed demo publishable key.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      # Server-only. Personas are on (the Supabase URL above is local), and the
      # password is a canary: check:bundle fails if it reaches the browser
      # bundle, and fails under CI=true if either variable is unset.
      PROTOTYPE_PERSONAS: "true"
      PROTOTYPE_PERSONA_PASSWORD: ci-canary-persona-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: No hex colors outside globals.css
        run: pnpm check:hex

      - name: Unit and component tests (including axe)
        run: pnpm test

      # The database only (no Auth, API or Storage containers), which is all
      # the next three steps need. It applies the migrations on start.
      - name: Start local database
        run: pnpm exec supabase db start

      - name: Apply migrations from scratch, then seed.sql
        run: pnpm exec supabase db reset

      - name: pgTAP (catalog, org reference and members)
        run: pnpm exec supabase test db

      - name: Generated types match the schema
        run: pnpm db:types && git diff --exit-code -- src/lib/supabase/database.types.ts

      - name: Build
        run: pnpm build

      - name: No secrets in browser bundles
        run: pnpm check:bundle
